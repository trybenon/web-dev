# No upload step or real credentials: CI validates the same prepared release stages.
services:
  app:
    image: watch-together:release-check
    build:
      target: release-check
  artifacts:
    profiles: [checks]
    image: watch-together:release-artifacts
    build:
      context: .
      target: release-build
      args:
        APP_RELEASE: ${APP_RELEASE:?Set the full commit SHA}
        BUGSINK_DSN: ${BUGSINK_DSN:?Set the Bugsink DSN}
    command: ["npm", "run", "check:release"]
