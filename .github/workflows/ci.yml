name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-checks:
    name: deploy checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Validate deployment script
        run: |
          bash -n scripts/deploy.sh
          shellcheck scripts/deploy.sh scripts/upload-bugsink-sourcemaps.sh
          python3 -m unittest discover -s scripts -p 'test_deploy.py' -v
      - name: Validate production Compose
        env:
          APP_IMAGE: ghcr.io/trybenon/web-dev:test
        run: docker compose -f deploy/compose.yml config --quiet

  checks:
    name: ${{ matrix.script }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        script:
          - format:check
          - lint
          - test
          - coverage
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run check
        run: npm run ${{ matrix.script }}

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run e2e

      - name: Upload browser test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  release-image:
    name: production image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_RELEASE: ${{ github.sha }}
      BUGSINK_DSN: https://public@bugsink.invalid/1
      COMPOSE_FILE: docker-compose.yml:compose.check.yml
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - uses: docker/setup-buildx-action@v3
      - name: Build application and source maps through Compose
        run: docker compose build app artifacts
      - name: Export the compiled artifacts for the browser test
        shell: bash
        run: |
          mkdir -p .release
          docker compose run --rm --no-deps -T artifacts tar -czf - -C /app/.release . | tar -xzf - -C .release
          mkdir -p shared/dist
          cp -R .release/shared/dist/. shared/dist/
      - run: npx playwright install --with-deps chromium
      - name: Verify original Vue source context
        run: npm run check:release:browser
      - name: Check packaged file hashes and server event against source maps
        run: |
          docker compose run --rm --no-deps -T \
            --volume "$PWD/scripts:/app/checks:ro" \
            --volume "$PWD/.release:/artifacts:ro" \
            app \
            node /app/checks/check-monitoring.mjs /artifacts /app
      - name: Start the application through Compose
        run: docker compose up --detach --no-build --wait --wait-timeout 90 app
      - name: Check the production entrypoint
        run: docker compose exec -T app node scripts/healthcheck.mjs
      - name: Stop containers
        if: always()
        run: docker compose down --remove-orphans

  deploy:
    name: Deploy main
    needs: [checks, e2e, deploy-checks, release-image]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
